apiVersion: skaffold/v4beta11
kind: Config
metadata:
  name: vaultflow-pipeline
build:
  artifacts:
    - image: vaultflow-api
      context: ./app
      docker:
        dockerfile: Dockerfile
  local:
    push: false 

manifests:
  hooks:
    before:
      - host:
          command: ["sh", "-c", "kubectl create secret tls vaultflow-tls-secret --cert=vaultflow.crt --key=vaultflow.key --namespace=vaultflow-team-a --dry-run=client -o yaml | kubectl apply -f -"]
  
  helm:
    releases:
      - name: vaultflow-api-team-a
        chartPath: ./charts/vaultflow-api
        namespace: vaultflow-team-a
        setValueTemplates:
          image.repository: "{{.IMAGE_REPO}}"
          image.tag: "{{.IMAGE_TAG}}"
          image.pullPolicy: "IfNotPresent"
      - name: vaultflow-obs
        chartPath: charts/vaultflow-observability
        namespace: vaultflow-team-a
        skipBuildDependencies: true

deploy:
  helm: {}

# ── 🔒 LOCK-SYNCHRONIZED PORT FORWARDING ─────────────────────────────
portForward:
  - resourceType: service
    resourceName: ingress-nginx-controller
    namespace: ingress-nginx
    port: 443
    localPort: 8443                                # 👈 Restored to standard 8443 local port
  - resourceType: service
    resourceName: vaultflow-prometheus-svc         # 👈 Matched back to your active service
    namespace: vaultflow-team-a
    port: 9090                                     # 👈 Fixed internal port back to 9090
    localPort: 9090
  - resourceType: service
    resourceName: vaultflow-grafana-svc            # 👈 Matched back to your active service
    namespace: vaultflow-team-a
    port: 3000                                     # 👈 Fixed internal port back to 3000
    localPort: 3000