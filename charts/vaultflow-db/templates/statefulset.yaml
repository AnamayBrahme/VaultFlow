apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "vaultflow-db.fullname" . }}
  namespace: {{ .Release.Namespace }}
spec:
  serviceName: {{ include "vaultflow-db.fullname" . }}
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "vaultflow-db.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vaultflow-db.selectorLabels" . | nindent 8 }}
    spec:
      # Node placement rules to target desktop-worker2
      nodeSelector:
        role: db
      tolerations:
        - key: "role"
          operator: "Equal"
          value: "db"
          effect: "NoSchedule"
      securityContext:
        fsGroup: 999
        runAsGroup: 999
        runAsUser: 999
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgresql.username | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.postgresql.password | quote }}
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"
          ports:
            - containerPort: 5432
              name: postgres
          volumeMounts:
            - name: pgdata
              mountPath: {{ .Values.storage.mountPath }}
          securityContext:
            runAsUser: 999
            runAsGroup: 999
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false  # Postgres needs to write to its lock/wal files inside the container
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
  
  # Dynamic per-pod storage provisioning (The core of Phase 5)
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: [ "ReadWriteOnce" ]
        storageClassName: {{ .Values.storage.className | quote }}
        resources:
          requests:
            storage: {{ .Values.storage.size | quote }}