apiVersion: v1
kind: Service
metadata:
  name: {{ include "vaultflow-db.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vaultflow-db.labels" . | nindent 4 }}
spec:
  clusterIP: None
  ports:
    - port: 5432
      name: postgres
  selector:
    {{- include "vaultflow-db.selectorLabels" . | nindent 4 }}