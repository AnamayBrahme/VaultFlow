apiVersion: v1
kind: ConfigMap
metadata:
  name: vaultflow-prometheus-config
  namespace: default # Change this if your monitoring runs in a different namespace
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: 'vaultflow-api-discovery'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            action: keep
            regex: vaultflow-api
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            action: keep
            regex: "8080"