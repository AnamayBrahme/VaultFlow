apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vaultflow-ingress
  namespace: vaultflow-team-a
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  tls:
  - hosts:
    - localhost
    secretName: vaultflow-tls-secret
  rules:
  - host: localhost
    http:
      paths:
      # 🟢 FIXED: Maps both /ui and /ui/ to your app perfectly
      - path: /
        pathType: Prefix
        backend:
          service:
            name: vaultflow-api-team-a
            port:
              name: http
      # 🟢 FIXED: Maps both /api and /api/ to your endpoints perfectly
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: vaultflow-api-team-a
            port:
              name: http