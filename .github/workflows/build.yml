# This workflow is the ARTIFACT layer — it turns trusted code on main into
# an immutable, versioned Docker image. It never touches a Kubernetes
# cluster; that job belongs to deploy.yml, which comes after this.
name: vaultflow-build

on:
  # Only runs after code lands on main — never on pull requests.
  # This is intentional: PRs are unverified/untrusted code, and this job
  # will use write-level registry credentials, so it must stay restricted
  # to the protected main branch only.
  push:
    branches: [main]
    paths:
      - "app/**"                 # Only rebuild when app source actually changes
      - ".github/workflows/build.yml"

# Environment variables shared across every job/step below
env:
  REGISTRY: ghcr.io                          # GitHub Container Registry
  IMAGE_NAME: ${{ github.repository }}/vaultflow-api   # e.g. yourname/vaultflow/vaultflow-api

# SECURITY: default is read-only. Each job below explicitly requests only
# the extra scopes it actually needs (packages:write, id-token:write, etc.)
permissions:
  contents: read

concurrency:
  group: vaultflow-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # JOB 1: Build the image, scan it, and push it only if it's clean
  # ============================================================
  build-and-push:
    name: Build, scan, and push image
    runs-on: ubuntu-latest

    # This job needs MORE than the default read-only token:
    # - packages: write  → required to push to ghcr.io
    # - id-token: write  → required if you later add build provenance/attestation
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      # Pull the repo code onto the runner
      - name: Checkout
        uses: actions/checkout@v4

      # Sets up Docker Buildx — the modern Docker build engine that supports
      # caching, multi-platform builds, and better performance than legacy
      # `docker build`
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Logs into GHCR using the auto-generated GITHUB_TOKEN — no separate
      # long-lived registry password needs to be stored as a secret, since
      # GITHUB_TOKEN is scoped to this repo and expires after the job ends
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Automatically generates smart, consistent tags and labels for the
      # image instead of you hardcoding tag strings by hand. This produces:
      # - a tag from the short commit SHA (immutable, always unique)
      # - a "latest" tag ONLY when building from the default branch
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # Builds the image from app/Dockerfile using app/ as the build context.
      # push: false here on purpose — we build FIRST, scan it, and only push
      # in a later step if the scan passes. This avoids publishing an image
      # that turns out to have critical vulnerabilities.
      - name: Build image (not pushed yet)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          push: false
          load: true                     # loads the built image into the local
                                          # Docker daemon so Trivy can scan it
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha           # reuses GitHub Actions cache to
          cache-to: type=gha,mode=max    # speed up repeated builds significantly

      # Scans the freshly built image for known vulnerabilities (CVEs) in
      # both OS packages and application libraries. exit-code: '1' means
      # this step FAILS the whole job if CRITICAL or HIGH issues are found —
      # which blocks the push step below from ever running.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"

      # Uploads the human-readable scan output as a downloadable artifact
      # on the workflow run page, so you (or teammates) can review exactly
      # what Trivy found, even for old runs
      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-results.txt
          if-no-files-found: ignore

      # Only reached if the scan step above passed (job didn't already fail).
      # This is the actual push to GHCR — the image becomes a real,
      # pullable artifact that deploy.yml can later reference by tag.
      - name: Push image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max